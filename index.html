<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-white p-4" style="font-family: 'Nunito', sans-serif;">

  <main class="w-full max-w-3xl border-2 border-black rounded-2xl px-6 py-10 md:px-24 md:py-16">

    <h1 class="text-lg mb-2">Task Tracker</h1>

    <div class="flex items-center border-2 border-slate-700 rounded-xl py-1 pl-3 pr-1">

      <input id="task-input" type="text" class="grow px-4 rounded-l-lg outline-none bg-transparent  placeholder-blue-400"
        placeholder="Start writing and press enter to create task" autocomplete="off" />

      <button id="add-btn" class="btn btn-sm bg-black text-white border-black hover:bg-gray-800" aria-label="Add task">

        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2.5">

          <path stroke-linecap="round" stroke-linejoin="round" d="M20 5v6a3 3 0 01-3 3H4m0 0l4-4m-4 4l4 4" />

        </svg>

      </button>
      
    </div>

    <ul id="task-list" class="mt-4"></ul>

  </main>

  <script src="script.js"></script>
</body>

</html>
